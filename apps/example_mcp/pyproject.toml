[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "example-mcp"
version = "0.1.0"
description = "Example FastMCP server used as the template for future MCP services."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2,<3",
    "mcp-shared",
    "pydantic-settings>=2.8.1,<3",
]

[project.scripts]
example-mcp = "example_mcp.__main__:main"

[tool.uv.sources]
mcp-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/example_mcp"]

