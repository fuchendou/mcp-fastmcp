[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-shared"
version = "0.1.0"
description = "Shared utilities for all MCP services in the workspace."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.8.1,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_shared"]

