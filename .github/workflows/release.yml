name: release

on:
  push:
    tags:
      - "example-mcp-v*.*.*"
      - "mcp-shared-v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync workspace dependencies
        run: uv sync --all-packages --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

      - name: Resolve release target
        id: target
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            example-mcp-v*)
              echo "package_dir=apps/example_mcp" >> "$GITHUB_OUTPUT"
              echo "artifact_glob=apps/example_mcp/dist/*" >> "$GITHUB_OUTPUT"
              ;;
            mcp-shared-v*)
              echo "package_dir=packages/mcp_shared" >> "$GITHUB_OUTPUT"
              echo "artifact_glob=packages/mcp_shared/dist/*" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported tag: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Build selected package
        working-directory: ${{ steps.target.outputs.package_dir }}
        run: uv build

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.target.outputs.artifact_glob }}
